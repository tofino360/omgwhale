<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boop Boss Apps</title>
    <style>
        /* Base Styles & Background */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            background: url('background.png') no-repeat center center fixed;
            background-size: cover;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Header Style */
        header {
            text-align: center;
            padding: 40px 20px 20px 20px;
        }
        header h1 {
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: -0.05em;
            text-shadow: 0 4px 12px rgba(0, 0, 0, 0.6);
        }

        /* Main Showcase Container (Horizontal Layout) */
        main {
            display: flex;
            flex-direction: row;
            gap: 30px;
            padding: 20px 40px 40px 40px;
            overflow-x: auto;
            align-items: flex-start;
            scrollbar-width: thin;
            scrollbar-color: rgba(255,255,255,0.3) rgba(0,0,0,0.2);
        }
        /* Custom scrollbar for webkit browsers */
        main::-webkit-scrollbar {
            height: 8px;
        }
        main::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 4px;
        }
        main::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 4px;
        }

        /* App Panels */
        .app-panel {
            background: rgba(20, 20, 20, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 24px;
            min-width: 320px;
            max-width: 420px;
            flex-shrink: 0;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            transition: transform 0.2s ease, border-color 0.2s ease;
        }
        .app-panel:hover {
            transform: translateY(-4px);
            border-color: rgba(255, 255, 255, 0.2);
        }
        .app-panel h2 {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 8px;
            line-height: 1.4;
        }
        .app-panel p {
            font-size: 0.9rem;
            color: #b3b3b3;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        /* Image Thumbnails Group */
        .thumbnail-group {
            display: flex;
            gap: 12px;
            justify-content: flex-start;
        }
        .thumbnail-wrapper {
            position: relative;
            flex: 1;
            cursor: pointer;
            overflow: hidden;
            border-radius: 8px;
            background: rgba(0,0,0,0.2);
            border: 1px solid rgba(255,255,255,0.05);
        }
        .thumbnail-wrapper img {
            width: 100%;
            height: auto;
            max-height: 320px;
            object-fit: contain;
            display: block;
            transition: transform 0.3s ease;
        }
        .thumbnail-wrapper:hover img {
            transform: scale(1.04);
        }

        /* Footer Style */
        footer {
            text-align: center;
            padding: 30px 20px;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }
        footer a {
            color: rgba(255, 255, 255, 0.7);
            text-decoration: none;
            font-size: 0.95rem;
            transition: color 0.2s ease;
            display: inline-block;
            padding: 5px 10px;
        }
        footer a:hover {
            color: #ffffff;
        }

        /* Lightbox/Modal Styles */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .modal.active {
            opacity: 1;
            pointer-events: auto;
        }
        .modal-content {
            max-width: 90vw;
            max-height: 85vh;
            object-fit: contain;
            border-radius: 6px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            transform: scale(0.9);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .modal.active .modal-content {
            transform: scale(1);
        }
        .modal-close {
            position: absolute;
            top: 20px;
            right: 25px;
            color: #fff;
            font-size: 35px;
            font-weight: 300;
            cursor: pointer;
            user-select: none;
            line-height: 1;
            transition: color 0.2s ease;
        }
        .modal-close:hover {
            color: #cccccc;
        }

        /* Responsive adjustments for mobile/portrait screens */
        @media (max-width: 768px) {
            main {
                flex-direction: column;
                align-items: center;
                padding: 20px;
            }
            .app-panel {
                width: 100%;
                max-width: 100%;
                min-width: unset;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>Boop Boss Apps</h1>
    </header>

    <main>
        <!-- Panel 1: capy-build -->
        <section class="app-panel">
            <h2>capy-build</h2>
            <p>Capybara Go! pet build analyzer</p>
            <div class="thumbnail-group">
                <div class="thumbnail-wrapper" onclick="openLightbox('capy-build.png')">
                    <img src="capy-build.png" alt="capy-build screenshot">
                </div>
            </div>
        </section>

        <!-- Panel 2: BoopWatch -->
        <section class="app-panel">
            <h2>BoopWatch</h2>
            <p>Herpstat monitoring app for Android</p>
            <div class="thumbnail-group">
                <div class="thumbnail-wrapper" onclick="openLightbox('boopwatch1.png')">
                    <img src="boopwatch1.png" alt="BoopWatch screenshot 1">
                </div>
                <div class="thumbnail-wrapper" onclick="openLightbox('boopwatch2.png')">
                    <img src="boopwatch2.png" alt="BoopWatch screenshot 2">
                </div>
            </div>
        </section>

        <!-- Panel 3: BoopCast -->
        <section class="app-panel">
            <h2>BoopCast</h2>
            <p>extremely lightweight weather app for Android</p>
            <div class="thumbnail-group">
                <div class="thumbnail-wrapper" onclick="openLightbox('boopcast.png')">
                    <img src="boopcast.png" alt="BoopCast screenshot">
                </div>
            </div>
        </section>
    </main>

    <footer>
        <a href="mailto:boopbossapps@gmail.com">boopbossapps@gmail.com</a>
    </footer>

    <!-- Lightbox Modal Container -->
    <div id="lightbox" class="modal" onclick="closeLightbox()">
        <span class="modal-close">&times;</span>
        <img class="modal-content" id="lightbox-img" alt="Enlarged view" onclick="event.stopPropagation()">
    </div>

    <script>
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');

        function openLightbox(imageSrc) {
            lightboxImg.src = imageSrc;
            lightbox.classList.add('active');
            document.body.style.overflow = 'hidden'; // Prevents background scrolling while open
        }

        function closeLightbox() {
            lightbox.classList.remove('active');
            document.body.style.overflow = ''; // Restores scrolling
            // Clear src after transition completes to prevent image flashing next time it opens
            setTimeout(() => {
                if(!lightbox.classList.contains('active')) {
                    lightboxImg.src = '';
                }
            }, 300);
        }

        // Close lightbox if Escape key is pressed
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' && lightbox.classList.contains('active')) {
                closeLightbox();
            }
        });
    </script>
</body>
</html>
